name: Subir a pruebas
on:
  push:
    branches: [main]
    paths: ['src/**', 'marca/**', 'build.js', 'web/**', 'voces-publicadas/**', 'herramientas/subir-a-pruebas.js']
  workflow_dispatch:
concurrency: { group: pruebas, cancel-in-progress: false }
jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Armar el juego
        run: node build.js && mkdir -p web/voces && cp voces-publicadas/* web/voces/
      - name: Subir lo que cambió
        env: { SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}' }
        run: node herramientas/subir-a-pruebas.js
      - run: echo "Listo → https://app.ecofamiliar.org/pruebas/mi-piano-3/" >> $GITHUB_STEP_SUMMARY
